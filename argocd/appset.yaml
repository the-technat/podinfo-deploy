apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: podinfo-pr-previews
  namespace: argocd
spec:
  # Use Go templating ({{ .number }}) instead of the legacy {{number}} syntax.
  # missingkey=error makes a typo in a variable name fail loudly.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - pullRequest:
        github:
          owner: the-technat
          repo: podinfo-deploy
          # Authenticate as a GitHub App instead of a PAT (lists open PRs).
          # The Secret holds the App credentials in Argo CD's repo-creds format:
          #   kubectl -n argocd create secret generic github-app-repo-creds \
          #     --from-literal=type=git \
          #     --from-literal=url=https://github.com/the-technat \
          #     --from-literal=githubAppID=<app-id> \
          #     --from-literal=githubAppInstallationID=<installation-id> \
          #     --from-file=githubAppPrivateKey=./app.private-key.pem
          #   kubectl -n argocd label secret github-app-repo-creds \
          #     argocd.argoproj.io/secret-type=repo-creds
          appSecretName: github-app-repo-creds
          # Optional: only create previews for PRs carrying this label.
          # labels:
          #   - preview
        # Poll interval. Default is 30 min, which feels broken for previews.
        # Keep >= 30s to stay inside GitHub's API rate limit, or use a webhook.
        requeueAfterSeconds: 60

  template:
    metadata:
      # One Application per PR: podinfo-pr-42, podinfo-pr-43, ...
      name: 'podinfo-pr-{{ .number }}'
      labels:
        app.kubernetes.io/part-of: pr-previews
        pr-number: '{{ .number }}'
      annotations:
        # Read by the notification template (argocd/argocd-values.yaml) for the
        # URL in the PR comment and the GitHub environment link.
        preview-url: 'http://pr-{{ .number }}.k8s.orb.local'
        # Opts this app in to the GitHub notification trigger. The value stays
        # empty because the github service has no per-app recipient.
        notifications.argoproj.io/subscribe.on-pr-preview-deployed.github: ""
        # Shows the preview as a clickable link on the app in the Argo CD UI.
        link.argocd.argoproj.io/external-link: 'http://pr-{{ .number }}.k8s.orb.local'
      # Makes Argo CD delete the deployed resources when the Application
      # itself is deleted (which happens when the PR is closed/merged).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/the-technat/podinfo-deploy.git
        targetRevision: '{{ .head_sha }}'     # exact commit of the PR
        path: charts/podinfo-umbrella
        helm:
          releaseName: 'podinfo-pr-{{ .number }}'
          valueFiles:
            - values-orbstack.yaml
          # Per-PR overrides; they win over the value files.
          valuesObject:
            podinfo:
              ui:
                # `title` is the PR title from GitHub; trunc keeps it tidy.
                message: 'PR #{{ .number }}: {{ .title | trunc 60 }}'
              ingress:
                # Own host per PR, otherwise every preview would claim the
                # host from values-orbstack.yaml. Lists replace, not merge, in Helm.
                hosts:
                  - host: 'pr-{{ .number }}.k8s.orb.local'
                    paths:
                      - path: /
                        pathType: ImplementationSpecific
      destination:
        server: https://kubernetes.default.svc
        namespace: 'preview-pr-{{ .number }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
